<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackRF // PANEL</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --accent: #00e676; /* Hacker Green */
            --danger: #ff5252;
            --border: #333;
            --radius: 8px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--accent);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Frequency Input */
        .freq-panel {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
        }

        .freq-label {
            font-weight: bold;
            margin-right: 15px;
            color: var(--text-dim);
        }

        .freq-input {
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            flex: 1;
            font-weight: bold;
            outline: none;
        }

        /* Module Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .card:hover {
            border-color: #555;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .card-header i {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .card-title {
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
        }
        
        .card-content {
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .card.expanded .card-content {
            display: flex;
        }
        
        .card.expanded {
            border-color: var(--accent);
            grid-column: span 1; 
        }
        
        /* Form elements inside cards */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }
        
        input[type="text"], select {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
        }

        /* Action Buttons */
        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: var(--accent);
            color: #000;
        }
        
        .btn-stop {
            background-color: var(--danger);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        /* Terminal */
        .terminal-container {
            background-color: #000;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: 400px;
        }

        .terminal-header {
            background-color: #222;
            padding: 8px 15px;
            font-size: 0.8rem;
            color: #888;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .terminal-output {
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #ddd;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
        }

        /* Analysis Results Table */
        .analysis-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.8rem;
        }
        .analysis-table th, .analysis-table td {
            border: 1px solid #444;
            padding: 5px;
            text-align: left;
        }
        .analysis-table th { background: #222; color: var(--accent); }

    </style>
</head>
<body>

<nav>
    <div class="brand">
        <i class="fas fa-microchip"></i> HackRF // CONTROL
    </div>
    <div class="status">
        <div class="status-dot"></div> SYSTEM ONLINE
    </div>
</nav>

<main>
    <div class="freq-panel">
        <span class="freq-label">FREQ (Hz):</span>
        <input type="number" class="freq-input" id="freq" value="315000000">
    </div>

    <button class="btn btn-stop" onclick="stopTool()">
        <i class="fas fa-stop-circle"></i> STOP ALL OPERATIONS
    </button>

    <div class="grid">
        <!-- JAMMER CARD -->
        <div class="card" onclick="toggleCard(this)">
            <div class="card-header">
                <i class="fas fa-broadcast-tower"></i>
                <div class="card-title">JAMMER</div>
            </div>
            <div class="card-content" onclick="event.stopPropagation()">
                <div class="form-group">
                    <label class="form-label">Mode</label>
                    <select id="jammer-mode">
                        <option value="white">White Noise (Default)</option>
                        <option value="sweep">Sweep Jam</option>
                    </select>
                </div>
                <button class="btn" onclick="startTool('jammer')">Start Jamming</button>
            </div>
        </div>

        <!-- REPLAY CARD -->
        <div class="card" onclick="toggleCard(this)">
            <div class="card-header">
                <i class="fas fa-redo"></i>
                <div class="card-title">REPLAY ATTACK</div>
            </div>
            <div class="card-content" onclick="event.stopPropagation()">
                <div class="form-group">
                    <label class="form-label">Capture File</label>
                    <input type="text" id="replay-file" value="capture.iq" placeholder="capture.iq">
                </div>
                <button class="btn" onclick="startTool('replay')">Capture & Replay</button>
            </div>
        </div>

        <!-- ANALYZER CARD -->
        <div class="card" onclick="toggleCard(this)">
            <div class="card-header">
                <i class="fas fa-wave-square"></i>
                <div class="card-title">SIGNAL ANALYZER</div>
            </div>
            <div class="card-content" onclick="event.stopPropagation()">
                <div class="form-group">
                    <label class="form-label">Input File</label>
                    <input type="text" id="analyze-file" value="capture.iq">
                </div>
                <div class="form-group">
                    <label class="form-label">Est. Baud Rate</label>
                    <input type="number" id="analyze-baud" value="2000">
                </div>
                <button class="btn" onclick="startTool('analyze')">Analyze Signal</button>
            </div>
        </div>

        <!-- SALAMANDRA CARD -->
        <div class="card" onclick="toggleCard(this)">
            <div class="card-header">
                <i class="fas fa-bug"></i>
                <div class="card-title">SALAMANDRA</div>
            </div>
            <div class="card-content" onclick="event.stopPropagation()">
                <div class="form-group">
                    <label class="form-label">Threshold (dBm)</label>
                    <input type="number" value="-40">
                </div>
                <button class="btn" onclick="startTool('salamandra')">Scan for Bugs</button>
            </div>
        </div>

        <!-- DRONE CARD -->
        <div class="card" onclick="toggleCard(this)">
            <div class="card-header">
                <i class="fas fa-plane"></i>
                <div class="card-title">DRONE DETECT</div>
            </div>
            <div class="card-content" onclick="event.stopPropagation()">
                <button class="btn" onclick="startTool('drone')">Monitor Airspace</button>
            </div>
        </div>

        <!-- RTL_433 CARD -->
        <div class="card" onclick="toggleCard(this)">
            <div class="card-header">
                <i class="fas fa-satellite-dish"></i>
                <div class="card-title">RTL_433 DECODER</div>
            </div>
            <div class="card-content" onclick="event.stopPropagation()">
                <button class="btn" onclick="startTool('rtl433')">Decode Stream</button>
            </div>
        </div>
    </div>

    <div class="terminal-container">
        <div class="terminal-header">
            <span>TERMINAL OUTPUT</span>
            <span id="term-status">IDLE</span>
        </div>
        <div class="terminal-output" id="console-output">
            > System Ready.
            > Click a module to expand options.
        </div>
    </div>
</main>

<script>
    const consoleDiv = document.getElementById('console-output');
    const termStatus = document.getElementById('term-status');
    let pollInterval = null;

    function toggleCard(card) {
        // Collapse others
        document.querySelectorAll('.card').forEach(c => {
            if (c !== card) c.classList.remove('expanded');
        });
        card.classList.toggle('expanded');
    }

    async function startTool(toolName) {
        const freq = document.getElementById('freq').value;
        let payload = { tool: toolName, freq: freq };

        // Gather extra args
        if (toolName === 'analyze') {
            payload.file = document.getElementById('analyze-file').value;
            payload.baud = document.getElementById('analyze-baud').value;
        }

        log(`[CMD] Launching ${toolName}...`);
        
        try {
            const res = await fetch('/api/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            log(`[SYS] ${data.status}`);
            
            if (data.status === "Started") {
                startPolling();
                termStatus.innerText = "RUNNING";
                termStatus.style.color = "#00e676";
            }
        } catch (e) {
            log(`[ERR] Connection failed: ${e}`);
        }
    }

    async function stopTool() {
        try {
            await fetch('/api/stop', { method: 'POST' });
            log(`[CMD] STOP Signal Sent.`);
            termStatus.innerText = "STOPPED";
            termStatus.style.color = "#ff5252";
        } catch (e) {
            log(`[ERR] Failed to stop`);
        }
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(fetchLogs, 1000);
    }

    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            const data = await res.json();
            if (data.logs) {
                // If the log contains JSON-like structure (e.g. from analyzer), we could parse it here
                // For now, just append text
                consoleDiv.innerText = data.logs;
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
        } catch (e) { }
    }

    function log(msg) {
        consoleDiv.innerText += `\n${msg}`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }
</script>

</body>
</html>
