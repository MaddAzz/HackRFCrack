<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackRF // PANEL</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --accent: #00e676; /* Hacker Green */
            --danger: #ff5252;
            --border: #333;
            --radius: 8px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--accent);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Frequency Input */
        .freq-panel {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
        }

        .freq-label {
            font-weight: bold;
            margin-right: 15px;
            color: var(--text-dim);
        }

        .freq-input {
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            flex: 1;
            font-weight: bold;
            outline: none;
        }

        /* Module Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .card i {
            font-size: 2rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .card.active {
            border-color: var(--accent);
            background-color: rgba(0, 230, 118, 0.05);
        }

        .card.active i {
            color: var(--accent);
        }

        .card-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Terminal */
        .terminal-container {
            background-color: #000;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 300px;
        }

        .terminal-header {
            background-color: #222;
            padding: 8px 15px;
            font-size: 0.8rem;
            color: #888;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .terminal-output {
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #ddd;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
        }

        .stop-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: var(--radius);
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            margin-bottom: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .stop-btn:active {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="brand">
        <i class="fas fa-microchip"></i> HackRF
    </div>
    <div class="status">
        <div class="status-dot"></div> ONLINE
    </div>
</nav>

<main>
    <div class="freq-panel">
        <span class="freq-label">FREQ (Hz):</span>
        <input type="number" class="freq-input" id="freq" value="315000000">
    </div>

    <button class="stop-btn" onclick="stopTool()">
        <i class="fas fa-stop-circle"></i> STOP ALL OPERATIONS
    </button>

    <div class="grid">
        <div class="card" onclick="startTool('jammer')">
            <i class="fas fa-broadcast-tower"></i>
            <span class="card-title">JAMMER</span>
        </div>
        <div class="card" onclick="startTool('replay')">
            <i class="fas fa-redo"></i>
            <span class="card-title">REPLAY</span>
        </div>
        <div class="card" onclick="startTool('salamandra')">
            <i class="fas fa-bug"></i>
            <span class="card-title">SALAMANDRA</span>
        </div>
        <div class="card" onclick="startTool('drone')">
            <i class="fas fa-plane-arrival"></i>
            <span class="card-title">DRONE DETECT</span>
        </div>
        <div class="card" onclick="startTool('rtl433')">
            <i class="fas fa-satellite-dish"></i>
            <span class="card-title">RTL_433</span>
        </div>
        <div class="card" onclick="toggleLogs()">
            <i class="fas fa-terminal"></i>
            <span class="card-title">TOGGLE LOGS</span>
        </div>
    </div>

    <div class="terminal-container">
        <div class="terminal-header">
            <span>TERMINAL OUTPUT</span>
            <span id="term-status">IDLE</span>
        </div>
        <div class="terminal-output" id="console-output">
            > System Ready.
            > Waiting for command...
        </div>
    </div>
</main>

<script>
    const consoleDiv = document.getElementById('console-output');
    const termStatus = document.getElementById('term-status');
    let pollInterval = null;

    async function startTool(toolName) {
        const freq = document.getElementById('freq').value;
        
        log(`[CMD] Launching ${toolName}...`);
        highlightCard(toolName);
        
        try {
            const res = await fetch('/api/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tool: toolName, freq: freq })
            });
            const data = await res.json();
            log(`[SYS] ${data.status}`);
            
            if (data.status === "Started") {
                startPolling();
                termStatus.innerText = "RUNNING";
                termStatus.style.color = "#00e676";
            }
        } catch (e) {
            log(`[ERR] Connection failed`);
        }
    }

    async function stopTool() {
        try {
            await fetch('/api/stop', { method: 'POST' });
            log(`[CMD] STOP Signal Sent.`);
            termStatus.innerText = "STOPPED";
            termStatus.style.color = "#ff5252";
            clearHighlights();
        } catch (e) {
            log(`[ERR] Failed to stop`);
        }
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(fetchLogs, 1000);
    }

    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            const data = await res.json();
            if (data.logs) {
                consoleDiv.innerText = data.logs;
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
        } catch (e) { }
    }

    function log(msg) {
        consoleDiv.innerText += `\n${msg}`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function highlightCard(toolName) {
        // Simple visual feedback implementation could go here if we added IDs to cards
    }

    function clearHighlights() {
        // Remove active class
    }

    function toggleLogs() {
        // Implementation to maybe collapse terminal, current placeholder
    }
</script>

</body>
</html>
